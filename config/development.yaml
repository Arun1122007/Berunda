# =============================================================================
# Development Configuration Overrides
# =============================================================================

app:
  debug: true

server:
  workers: 1
  reload: true

logging:
  level: "DEBUG"
  format: "pretty"

database:
  type: "sqlite"
  path: "./data/berunda_dev.db"
  echo: true
  pool_size: 5
  max_overflow: 10

cache:
  type: "memory"
  ttl: 300

auth:
  provider: "mock"
  jwt_secret: "dev-secret-change-in-production"
  jwt_expiry: "24h"
  jwt_issuer: "berunda-dev"

ai:
  provider: "mock"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "llama3.2"
  embedding_dimension: 384
  temperature: 0.7

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:8080"

rate_limiting:
  enabled: false

entity_resolution:
  similarity_threshold: 0.85
  max_candidates: 50
  batch_size: 100

feature_flags:
  real_time_alerts: false
