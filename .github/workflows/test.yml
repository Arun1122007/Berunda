name: Full Test Suite

on:
  pull_request:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  unit-python:
    name: Unit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -m unit --tb=short --cov=src --cov-report=term-missing --cov-fail-under=70

  unit-node:
    name: Unit (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm test -- --run
        working-directory: apps/web

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berunda
          POSTGRES_PASSWORD: berunda_test
          POSTGRES_DB: berunda_test
        options: >-
          --health-cmd pg_isready -U berunda
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -m integration --tb=short --cov=src --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://berunda:berunda_test@localhost:5432/berunda_test
          APP_ENV: test
          JWT_SECRET: test-secret
          LOG_LEVEL: WARNING

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: apps/web
      - name: Run E2E tests
        run: npx playwright test
        working-directory: apps/web
        continue-on-error: true

  performance:
    name: Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - run: k6 run scripts/load/performance-test.js
        continue-on-error: true
