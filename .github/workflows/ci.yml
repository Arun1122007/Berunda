name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  lint-node:
    name: Lint (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berunda
          POSTGRES_PASSWORD: berunda_test
          POSTGRES_DB: berunda_test
        options: >-
          --health-cmd pg_isready -U berunda
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest --tb=short --cov=src --cov-report=term-missing --cov-fail-under=70
        env:
          DATABASE_URL: postgresql+asyncpg://berunda:berunda_test@localhost:5432/berunda_test
          APP_ENV: test
          JWT_SECRET: test-secret
          LOG_LEVEL: WARNING

  test-node:
    name: Test (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web

  build-node:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-python, lint-node, test-python, test-node, build-node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
