name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    strategy:
      matrix:
        language: [python, node]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node dependencies
        if: matrix.language == 'node'
        run: |
          npm ci --no-audit --no-fund || true

      - name: Ruff check (Python)
        if: matrix.language == 'python'
        run: ruff check .

      - name: Mypy (Python)
        if: matrix.language == 'python'
        run: mypy . --ignore-missing-imports || true

      - name: ESLint (Node)
        if: matrix.language == 'node'
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0 || true

      - name: Prettier check (Node)
        if: matrix.language == 'node'
        run: npx prettier --check . || true

  test:
    name: Test
    strategy:
      matrix:
        language: [python, node]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node dependencies
        if: matrix.language == 'node'
        run: |
          npm ci --no-audit --no-fund || true

      - name: Run Python tests with coverage
        if: matrix.language == 'python'
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            -v

      - name: Run Node tests
        if: matrix.language == 'node'
        run: npx vitest run --coverage || true

      - name: Upload coverage to Codecov
        if: matrix.language == 'python'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: python

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.language }}-${{ github.sha }}
          path: |
            htmlcov/
            coverage/

  build:
    name: Build
    strategy:
      matrix:
        language: [python, node]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node dependencies
        if: matrix.language == 'node'
        run: |
          npm ci --no-audit --no-fund || true

      - name: Verify Python imports
        if: matrix.language == 'python'
        run: python -c "import sys; print(f'Python {sys.version} is ready')"

      - name: Build Node app
        if: matrix.language == 'node'
        run: |
          if [ -f "apps/web/package.json" ]; then
            cd apps/web && npm run build
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: false
          tags: berunda-frontend:ci
          build-args: |
            API_URL=http://localhost:9000
            ENVIRONMENT=ci

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          tags: berunda-api:ci

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: false
          tags: berunda-worker:ci
