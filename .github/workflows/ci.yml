name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Lockfile freshness ────────────────────────────────────────
  lockfile-check:
    name: Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify requirements.lock matches requirements.txt
        run: |
          # Strip extras (e.g., uvicorn[standard] -> uvicorn), version specs, comments
          grep -E '^[a-zA-Z0-9_>-]' requirements.txt \
            | sed 's/\[.*\]//;s/[><=!].*//;s/#.*//;s/ //g' \
            | sort -u > /tmp/txt_pkgs.txt
          grep -E '^[a-z0-9_-]+==' requirements.lock \
            | sed 's/==.*//' | sort -u > /tmp/lock_pkgs.txt
          MISSING=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            if ! grep -qxi "$pkg" /tmp/lock_pkgs.txt; then
              echo "MISSING FROM LOCK: $pkg"
              MISSING=1
            fi
          done < /tmp/txt_pkgs.txt
          if [ "$MISSING" -eq 1 ]; then
            echo "❌ requirements.lock is stale — run: pip freeze > requirements.lock"
            exit 1
          fi
          echo "✅ requirements.lock is fresh"

  # ── Python quality gates ──────────────────────────────────────
  lint-python:
    name: Lint & Type (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e .
      # Format check
      - run: ruff format --check src/ tests/ scripts/
      # Lint
      - run: ruff check src/ tests/ scripts/
      # Type check (application code only)
      - run: mypy src/ --config-file pyproject.toml
      # SAST
      - run: bandit -r src/ -ll

  # ── Python tests with coverage ──────────────────────────────
  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berunda
          POSTGRES_PASSWORD: berunda_test
          POSTGRES_DB: berunda_test
        options: >-
          --health-cmd pg_isready -U berunda
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e .
      - run: pytest --tb=short --strict-markers -m "not slow" --junitxml=reports/junit-python.xml --cov=src --cov-report=term-missing --cov-report=xml:reports/coverage-python.xml --cov-report=html:reports/coverage-html --cov-fail-under=61
        env:
          DATABASE_URL: postgresql+asyncpg://berunda:berunda_test@localhost:5432/berunda_test
          APP_ENV: test
          JWT_SECRET: test-secret-not-for-production
          LOG_LEVEL: WARNING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-reports
          path: reports/
          retention-days: 14

  # ── Frontend quality gates ──────────────────────────────────
  lint-node:
    name: Lint (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web

  test-node:
    name: Test (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - run: npm test -- --reporter=junit --outputFile=reports/junit-node.xml
        working-directory: apps/web
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-test-reports
          path: apps/web/reports/
          retention-days: 14

  build-node:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # ── Import / boundary check ─────────────────────────────────
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e .
      # Verify all application modules import cleanly
      - run: python -c "import src.main; print('import src.main OK')"
      - run: python -c "import src.config; print('import src.config OK')"
      - run: python -c "import src.database; print('import src.database OK')"
      - run: python -c "import src.worker; print('import src.worker OK')"
      # Verify no cross-boundary imports from infrastructure code
      - run: python -c "
import ast, sys
for f in __import__('glob').glob('src/**/*.py', recursive=True):
    with open(f) as fh:
        tree = ast.parse(fh.read())
        for node in ast.walk(tree):
            if isinstance(node, ast.ImportFrom) and node.module and 'appsail' in node.module:
                print(f'BOUNDARY VIOLATION: {f} imports from appsail')
                sys.exit(1)
print('All boundary checks passed')
"

  # ── Docker build (main only) ────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-python, lint-node, test-python, test-node, build-node, import-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
