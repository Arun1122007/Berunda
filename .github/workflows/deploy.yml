name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: false
        default: ""
        type: string

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version tag
        id: version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            echo "tag=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build API image
        run: |
          docker build -f infrastructure/docker/api.Dockerfile \
            -t berunda/api:${{ steps.version.outputs.tag }} .
          echo "API image built: berunda/api:${{ steps.version.outputs.tag }}"

      - name: Build Frontend image
        run: |
          docker build -f infrastructure/docker/frontend.Dockerfile \
            --build-arg API_URL=https://${{ github.event.inputs.environment }}.berunda.gov.in/api/v1 \
            --build-arg VITE_API_BASE_URL=https://${{ github.event.inputs.environment }}.berunda.gov.in/api/v1 \
            --build-arg ENVIRONMENT=${{ github.event.inputs.environment }} \
            -t berunda/frontend:${{ steps.version.outputs.tag }} .
          echo "Frontend image built: berunda/frontend:${{ steps.version.outputs.tag }}"

      - name: Deploy via docker-compose
        run: |
          # Placeholder for actual deploy — adjust to your target infra
          echo "Deploying berunda/${{ github.event.inputs.environment }}..."
          echo "API:  berunda/api:${{ steps.version.outputs.tag }}"
          echo "FE:   berunda/frontend:${{ steps.version.outputs.tag }}"
          echo "DB:   postgres:16-alpine"
