services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: berunda
      POSTGRES_USER: berunda
      POSTGRES_PASSWORD: berunda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berunda"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - berunda-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "9000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://berunda:berunda@db:5432/berunda
      - JWT_SECRET=dev-secret-change-in-production
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - berunda-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        - API_URL=/api/v1
        - VITE_API_BASE_URL=/api/v1
        - ENVIRONMENT=development
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=/api/v1
      - VITE_API_BASE_URL=/api/v1
      - VITE_ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - berunda-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - berunda-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: celery -A src.worker worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://berunda:berunda@db:5432/berunda
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - berunda-network
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: celery -A src.worker beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://berunda:berunda@db:5432/berunda
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - berunda-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - berunda-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./infrastructure/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infrastructure/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards/berunda:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - berunda-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  berunda-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  prometheus_data:
  grafana_data:
