openapi: 3.0.3
info:
  title: Project Berunda API
  description: API specifications for Project Berunda Core backend services running on Zoho Catalyst.
  version: 1.0.0
servers:
  - url: https://{project}.catalystapps.io/server/berunda_api/v1
    description: Catalyst AppSail Backend
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
security:
  - bearerAuth: []
paths:
  /cases:
    get:
      summary: List cases
      description: Returns a paginated list of cases.
      responses:
        '200':
          description: A paginated array of cases
        '401':
          description: Unauthorized
  /cases/{caseMasterID}:
    get:
      summary: Get case details
      parameters:
        - name: caseMasterID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case details
  /persons:
    get:
      summary: List PersonEntities
      responses:
        '200':
          description: A paginated array of PersonEntities
  /persons/{personEntityID}:
    get:
      summary: Get person details and risk score
      parameters:
        - name: personEntityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Person details
  /hotspots:
    get:
      summary: Get geospatial hotspot layers
      responses:
        '200':
          description: GeoJSON/Hexbin data for hotspots
  /anomalies:
    get:
      summary: Get anomaly alerts
      responses:
        '200':
          description: Array of anomaly alerts
  /risk/scores/{personEntityID}:
    get:
      summary: Get risk score and feature importance
      parameters:
        - name: personEntityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Risk score details
  /rag/query:
    post:
      summary: Submit a natural language question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
      responses:
        '200':
          description: Answer with citations
  /fairness-checks:
    get:
      summary: Get fairness check results
      responses:
        '200':
          description: Fairness validation status
  /health:
    get:
      summary: System health check
      security: []
      responses:
        '200':
          description: System is operational
